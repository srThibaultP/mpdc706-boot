image boot.vfat {
	vfat {
		files = { "zImage", "sun8i-a23-inet86dz.dtb", "boot.scr", "wifi.conf" }
	}
	size = 32M
}
image sdcard.img {
	hdimage { }
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
